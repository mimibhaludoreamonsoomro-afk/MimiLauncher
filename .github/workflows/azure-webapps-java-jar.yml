name: Build MimiLauncher JAR

on:
  push:
    branches: [ "master", "main", "dev" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      # Java 17 par set kiya hai taake Gradle 7.5 ke saath compatibility ka error na aaye
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Safely build karne ke liye assemble command behtar rahegi
      - name: Build with Gradle
        run: ./gradlew assemble

      - name: Upload MimiLauncher JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MimiLauncher-JAR
          path: '**/build/libs/*.jar'
