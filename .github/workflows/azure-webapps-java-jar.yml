name: Build MimiLauncher JAR

on:
  push:
    branches: [ "master", "main", "dev" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'zulu'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean package

      - name: Upload MimiLauncher JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MimiLauncher-JAR
          path: '**/target/*.jar'
