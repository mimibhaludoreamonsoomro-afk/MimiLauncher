name: Build MimiLauncher JAR

on:
  push:
    branches: [ "master", "main", "dev" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'zulu'

      # Yeh step missing JitPack dependency repository ko automatic inject karega
      - name: Auto-Fix Missing JitPack Dependency Repository
        run: |
          echo "Checking and updating build.gradle files..."
          find . -name "build.gradle" -exec sed -i "s|mavenCentral()|mavenCentral()\n        maven { url 'https://jitpack.io' }|g" {} +
          
          if [ -f "settings.gradle" ]; then
            echo "Updating settings.gradle..."
            sed -i "s|mavenCentral()|mavenCentral()\n        maven { url 'https://jitpack.io' }|g" settings.gradle
          fi

      # Linux runner ko gradlew execute karne ki permission dena
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Cache issues ko bypass karne aur safe build chalane ke liye
      - name: Build with Gradle
        run: ./gradlew assemble --no-configuration-cache -Dorg.gradle.jvmargs="--add-opens=java.base/java.util.concurrent=ALL-UNNAMED"

      - name: Upload MimiLauncher JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MimiLauncher-JAR
          path: '**/build/libs/*.jar'
